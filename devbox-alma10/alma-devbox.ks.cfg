# AlmaLinux 10 kickstart for an ephemeral, graphical agentic-dev VM.
# Companion to create-vm-devbox. Unrelated to create-vm / kvm_text_ks.cfg
# (that one's a headless RHEL/AlmaLinux Remote-SSH template, different guest).
#
# Display note: AlmaLinux deliberately re-enabled SPICE (reversing RHEL 10's
# removal), but GNOME on RHEL10-family is Wayland-only (no GNOME-on-Xorg
# fallback). The legacy QXL + spice-vdagent + X11-resize mechanism this
# project used for the Fedora attempt has nowhere reliable to attach under
# Wayland, so this uses the modern virtio-gpu + SPICE OpenGL/VirGL path
# instead (create-vm-devbox: --video virtio,accel3d=yes --graphics
# spice,gl.enable=yes). spice-vdagent is still attempted below for clipboard,
# but treated as best-effort -- see the %post comment near it. If dynamic
# resize/clipboard end up unreliable in practice, the documented fallback is
# switching to GNOME's built-in Wayland-native Remote Desktop (RDP) instead
# of a SPICE viewer.

ignoredisk --only-use=vda
clearpart --all --initlabel --drives=vda
zerombr

# explicit partitioning instead of autopart -- autopart --nohome was found to
# leave a large chunk of the disk completely unallocated rather than giving
# it to /, since /home (not /) is what autopart's heuristics treat as the
# "claim everything left over" partition. --grow on / is the deterministic
# way to actually get all remaining space, regardless of that capping logic.
part biosboot --fstype=biosboot --size=1
part /boot --fstype=xfs --size=1024
part swap --size=8192
part / --fstype=xfs --size=1 --grow
bootloader --timeout=5 --append="plymouth.enable=0"
firstboot --disabled

# without this, Anaconda's text-mode install pauses at completion with
# "Press ENTER to quit:" and waits for a keypress -- since create-vm's
# virt-install --wait -1 blocks until install is truly finished, that
# prompt would otherwise sit there needing a human in virt-viewer before
# the script could ever proceed. This makes the reboot fully automatic.
reboot

# unattended text-mode install; the SPICE/virtio-gpu display device is still
# attached to the VM the whole time, it's just unused until the installed
# system reboots into it
text

keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8

# --device=link (not a hardcoded ifname like enp1s0) survives PCI slot shifts
# caused by other devices -- e.g. the virtiofs filesystem -- attached in
# virt-install
network --bootproto=dhcp --device=link --ipv6=auto --activate --hostname=devbox

# no root login -- the 'dev' user (wheel/sudo) is the only way in
rootpw --lock
user --name=dev --groups=wheel --password=REPLACE-WITH-DEVPASSWORD-HASH --iscrypted

services --enabled=qemu-guest-agent,sshd

timezone America/New_York --utc
selinux --disabled

# ephemeral, single-use VM -- reboot straight into the graphical login
# (no 'shutdown'/'poweroff' here, unlike the clone-from-template workflow)

%packages
@^graphical-server-environment
mesa-dri-drivers
qemu-guest-agent
openssh-server
make
gcc
curl
git
gnupg2
%end

%post --interpreter=/bin/bash --log=/root/kickstart.log
systemctl set-default graphical.target

# a desktop VM doesn't need to block boot completion on network readiness;
# NetworkManager-wait-online's default timeout is a common cause of
# multi-minute stalls that show up as "stuck" near the end of boot
systemctl disable NetworkManager-wait-online.service

mkdir -p /mnt/hostshare
cat <<'EOF' >> /etc/fstab
hostshare /mnt/hostshare virtiofs ro,nofail 0 0
EOF
mount -a || true

# SSH is for pulling files out (SPICE has no guest->host clipboard/drag-drop
# for files, only host->guest). Reuses the same --dev-password rather than a
# separate key, since this is a secondary escape hatch, not the primary way
# in. Same posture as the vscode-server project: no root over SSH, only dev.
cat <<'EOF' > /etc/ssh/sshd_config.d/99-devbox.conf
PermitRootLogin no
PasswordAuthentication yes
AllowUsers dev
EOF

# RHEL/Alma's default firewalld zone usually already permits ssh, but make
# it explicit rather than rely on that default holding
firewall-cmd --permanent --add-service=ssh 2>/dev/null || true
firewall-cmd --reload 2>/dev/null || true

# scoped passwordless sudo for dnf only -- lets create-vm run the one-time
# post-install update over SSH non-interactively, without granting dev
# blanket passwordless sudo for everything
# scoped passwordless sudo for dnf only -- lets create-vm run the one-time
# post-install update over SSH non-interactively, without granting dev
# blanket passwordless sudo for everything
cat <<'EOF' > /etc/sudoers.d/99-devbox-dnf
dev ALL=(root) NOPASSWD: /usr/bin/dnf
EOF
chmod 0440 /etc/sudoers.d/99-devbox-dnf
visudo -cf /etc/sudoers.d/99-devbox-dnf

# skip sudo's first-use "we trust you have received the usual lecture" message
cat <<'EOF' > /etc/sudoers.d/98-devbox-nolecture
Defaults:dev !lecture
EOF
chmod 0440 /etc/sudoers.d/98-devbox-nolecture
visudo -cf /etc/sudoers.d/98-devbox-nolecture

# best-effort: spice-vdagent's Wayland support (needed for clipboard, and
# for smoother resize) is less mature than its old X11 path -- see the
# header comment above. Don't hard-fail the install if it's unavailable.
systemctl enable spice-vdagentd || \
  echo "spice-vdagent unavailable or failed to enable -- continuing without it" >> /root/kickstart.log

# early cleanup of the base-install package cache, before the (disk-heavier)
# tools.d builds run. Precautionary headroom, not a fix for the /tmp-mount
# issue documented above -- dnf cache lives on / (which had 105G free at
# the point of failure), not the constrained /tmp tmpfs that actually caused
# it. The final cleanup block still runs too, since vscode/opentofu's own
# dnf/rpm installs happen after this point.
dnf clean all
%end

%post --interpreter=/bin/bash --log=/root/devbox-tools-kickstart.log
REPLACE-WITH-DEVTOOLS-POST
%end

%post --interpreter=/bin/bash --log=/root/devbox-host-extras-kickstart.log
REPLACE-WITH-HOST-EXTRAS-POST
%end

%post --interpreter=/bin/bash --log=/root/devbox-gnome-tour-kickstart.log
# bypass the welcome tour popup system-wide for all users
mkdir -p /etc/dconf/db/local.d
cat > /etc/dconf/db/local.d/00-disable-gnome-tour << 'EOF'
[org/gnome/shell]
welcome-dialog-last-shown-version='999.0'
EOF

dconf update
%end

%post --interpreter=/bin/bash --log=/root/devbox-dnf-cleanup-kickstart.log
# runs last, after every dnf/rpm install in this kickstart (base packages,
# spice-vdagent above, and vscode/opentofu's own installs from tools.d) --
# reclaims the downloaded package cache, which isn't needed once installed
dnf clean all
%end
