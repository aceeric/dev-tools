# ignore everything except vda when auto partitioning
ignoredisk --only-use=vda

# remove partitions from the system, prior to creation of new partitions
clearpart --all --initlabel --drives=vda

# initialize unused partition tables
zerombr

# create a root partition (1 GB or larger), a swap partition, and an appropriate /boot
# partition for the architecture.
autopart --type=plain

# docs say this sets the timeout before the default boot is selected but - affects the
# installed OS (i.e. on second boot and thereafter) rather than the kickstart startup
# which always takes 60 seconds...
bootloader --timeout=5

# don't run the setup agent on first boot
firstboot --disabled

# do not configure the X Window System
skipx

# Shutdown after installation
shutdown

# non-graphical install
text

# keyboard layouts
keyboard --vckeymap=us --xlayouts='us'

# system language
lang en_US.UTF-8

# --device=link (rather than a hardcoded name like enp1s0) activates whichever
# interface has a link up, so this survives PCI device/slot shifts caused by
# other devices (e.g. the virtiofs filesystem) attached in virt-install
network --bootproto=dhcp --device=link --ipv6=auto --activate --hostname=vscode-server

# required RHEL repo
repo --name="AppStream" --baseurl=file:///run/install/repo/AppStream

# root password
rootpw frobozz

# keep the local host's time synchronized with the time server, and make sure
# sshd is running so VS Code's Remote-SSH extension can connect
services --enabled=chronyd,sshd

# system time zone. --utc means the system clock is UTC, which can be verified with 'sudo hwclock'
timezone America/New_York --utc

# no selinux
selinux --disabled

%packages
@core
# kexec-tools supports fast reboot
kexec-tools
# net-tools for network debugging
net-tools
# tar for dtk
tar
# for re-sizing the disk
cloud-utils-growpart
# for Kubernetes
socat
conntrack
ipset
# sshd - target for VS Code's Remote-SSH extension
openssh-server
openssh-clients
# VS Code Server self-installs over ssh on first connect and needs these
curl
tar
%end

#  kernel crash dump config
%addon com_redhat_kdump --enable --reserve-mb='auto'
%end

# create a dedicated, unprivileged user for VS Code's Remote-SSH connection
# (no sudo/wheel membership -- this account only needs the shared directory)
%post --interpreter=/bin/bash --log=/root/kickstart.log
useradd -m -s /bin/bash coder
mkdir -p /home/coder/.ssh
cat <<EOF >| /home/coder/.ssh/authorized_keys
REPLACE-WITH-SSHKEY
EOF
chmod 700 /home/coder/.ssh
chmod 600 /home/coder/.ssh/authorized_keys
chown -R coder:coder /home/coder/.ssh

# mount point for the virtiofs share (created via --shared-dir / --filesystem
# on the virt-install command); tag must match the 'target.dir' used there
mkdir -p /mnt/workspace
cat <<EOF >> /etc/fstab
sharedfolder /mnt/workspace virtiofs rw,nofail,x-systemd.requires=/mnt/workspace 0 0
EOF
chown coder:coder /mnt/workspace

# land the coder user in the shared workspace on login
echo 'cd /mnt/workspace 2>/dev/null' >> /home/coder/.bashrc

# harden sshd: no root login, key-only auth
cat <<EOF >| /etc/ssh/sshd_config.d/99-vscode-remote.conf
PermitRootLogin no
PasswordAuthentication no
AllowUsers coder
EOF
%end